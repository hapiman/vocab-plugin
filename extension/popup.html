<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Vocab Learner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      width: 240px;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      color: #cba6f7;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #313244;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 24px;
      font-weight: 700;
      display: block;
    }
    .stat-num.learning { color: #89b4fa; }
    .stat-num.mastered { color: #a6e3a1; }
    .stat-label {
      font-size: 11px;
      color: #6c7086;
      margin-top: 2px;
    }
    .divider { border: none; border-top: 1px solid #313244; margin: 10px 0; }
    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      background: #313244;
      border: none;
      border-radius: 7px;
      color: #cdd6f4;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      margin-bottom: 6px;
      transition: background 0.12s;
    }
    .btn-label { flex: 1; }
    .btn-pill {
      min-width: 22px;
      padding: 1px 7px;
      border-radius: 20px;
      background: #45475a;
      color: #cba6f7;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }
    .btn:hover { background: #45475a; }
    .btn:last-child { margin-bottom: 0; }
    .sync-status {
      min-height: 16px;
      margin: -2px 0 10px;
      color: #6c7086;
      font-size: 11px;
      line-height: 1.35;
    }
    .sync-status.error { color: #f38ba8; }
  </style>
</head>
<body>
  <h1>📚 Vocab Learner</h1>

  <div class="stats">
    <div class="stat-card">
      <span class="stat-num learning" id="learningCount">-</span>
      <div class="stat-label">学习中</div>
    </div>
    <div class="stat-card">
      <span class="stat-num mastered" id="masteredCount">-</span>
      <div class="stat-label">已掌握</div>
    </div>
  </div>

  <div class="sync-status" id="syncStatus"></div>

  <hr class="divider">

  <button class="btn" id="reviewBtn">
    <span class="btn-label">🧠 开始复习</span>
    <span class="btn-pill" id="reviewDueCount">-</span>
  </button>
  <button class="btn" id="vocabBtn">📖 生词本与统计</button>
  <button class="btn" id="settingsBtn">⚙️ 设置 API Key / Gist</button>

  <script src="popup.js"></script>
</body>
</html>
